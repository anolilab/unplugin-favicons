# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Semantic Release"

on: # yamllint disable-line rule:truthy
    push:
        branches:
            - "([0-9])?(.{+([0-9]),x}).x"
            - "main"
            - "next"
            - "next-major"
            - "alpha"
            - "beta"

permissions:
    contents: "read" # for checkout

jobs:
    build:
        name: "Build Package"
        if: "github.repository == 'anolilab/unplugin-favicons'"
        runs-on: "ubuntu-latest"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
              with:
                  egress-policy: "audit"

            - name: "Wait for tests to succeed"
              uses: "lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994" # v1.9.1
              timeout-minutes: 20
              with:
                  ref: "${{ github.event.pull_request.head.sha || github.sha }}"
                  repo-token: "${{ secrets.GITHUB_TOKEN }}"
                  wait-interval: 60 # seconds
                  running-workflow-name: "Build Package" # wait for all other checks to complete
                  allowed-conclusions: "success,neutral,skipped" # all other checks must pass, being skipped or cancelled is not sufficient

            - name: "Git checkout"
              uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
              env:
                  GIT_COMMITTER_NAME: "GitHub Actions Shell"
                  GIT_AUTHOR_NAME: "GitHub Actions Shell"
                  EMAIL: "github-actions[bot]@users.noreply.github.com"

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/setup@1641a17797e6e1dc3eaf9b462c3c0dae91ab071d" # v20.2.12
              with:
                  node-version: "22.x"
                  cache-prefix: "semantic-release"
                  run-signatures-audit: "false" # npm audit signatures mis-resolves rolldown-vite as an optional peer of vite@8; pnpm installs it correctly

            - name: "Build Production"
              run: "pnpm run build:prod"

            - name: "test and coverage"
              run: "pnpm run test:coverage"
            # @TODO: Enable it later
            #            - name: "Upload code coverage to codecov"
            #              uses: "anolilab/workflows/step/codecov@main"
            #              with:
            #                  run-lint: "false"
            #                  codecov-token: "${{ secrets.CODECOV_TOKEN }}"

            - name: "Publish Build Artifacts"
              uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
              with:
                  name: "unplugin-favicons-dist"
                  path: "${{ github.workspace }}/dist"

    semantic-release:
        name: "Semantic Release"
        needs: ["build"]
        runs-on: "ubuntu-latest"
        permissions:
            contents: "write" # to be able to publish a GitHub release
            issues: "write" # to be able to comment on released issues
            pull-requests: "write" # to be able to comment on released pull requests
            id-token: "write" # to enable use of OIDC for npm provenance

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
              env:
                  GIT_COMMITTER_NAME: "GitHub Actions Shell"
                  GIT_AUTHOR_NAME: "GitHub Actions Shell"
                  EMAIL: "github-actions[bot]@users.noreply.github.com"

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/setup@1641a17797e6e1dc3eaf9b462c3c0dae91ab071d" # v20.2.12
              with:
                  node-version: "22.x"
                  cache-prefix: "semantic-release"
                  run-signatures-audit: "false" # npm audit signatures mis-resolves rolldown-vite as an optional peer of vite@8; pnpm installs it correctly

            - name: "Download Build Artifacts"
              uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
              with:
                  name: "unplugin-favicons-dist"
                  path: "${{ github.workspace }}/dist"

            - name: "Semantic Release"
              if: "success()"
              env:
                  GITHUB_TOKEN: "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}"
                  NPM_TOKEN: "${{ secrets.NPM_AUTH_TOKEN }}"
                  GIT_AUTHOR_NAME: "github-actions-shell"
                  GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
                  GIT_COMMITTER_NAME: "github-actions-shell"
                  GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
              run: "pnpm exec semantic-release"
